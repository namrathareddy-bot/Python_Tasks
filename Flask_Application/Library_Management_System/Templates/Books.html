<!DOCTYPE html>
<html>

<head>

    <title>Books</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h2>Books List</h2>

        <table>

            <tr>

                <th>Book ID</th>

                <th>Title</th>

                <th>Author</th>

                <th>Status</th>

            </tr>

            {% for book in books %}

            <tr>

                <td>{{ book.book_id }}</td>

                <td>{{ book.title }}</td>

                <td>{{ book.author }}</td>

                <td>{{ book.status }}</td>

            </tr>

            {% endfor %}

        </table>

        <br>

        <a href="/add-book">Add Book</a>

        <a href="/">Back Home</a>

    </div>

</body>
</html>
