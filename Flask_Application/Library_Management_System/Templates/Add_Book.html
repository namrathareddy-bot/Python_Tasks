<!DOCTYPE html>
<html>

<head>

    <title>Add Book</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h2>Add Book</h2>

        <form action="/add-book" method="POST">

            <input type="text"
                   name="book_id"
                   placeholder="Book ID"
                   required>

            <input type="text"
                   name="title"
                   placeholder="Book Title"
                   required>

            <input type="text"
                   name="author"
                   placeholder="Author Name"
                   required>

            <button type="submit">Add Book</button>

        </form>

        <br>

        <a href="/">Back Home</a>

    </div>

</body>
</html>
